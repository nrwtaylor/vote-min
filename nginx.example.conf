location /vote/api/ {
    access_log off;  # Disable access logging for this location

    client_max_body_size 16k;      # backend caps JSON bodies at 4kb itself; this is just headroom

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:3349/;   # <-- set to the real backend port (backend/.env PORT, default 4000)

    proxy_connect_timeout 10s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_headers on;
}

# Separate block for the live feed: it's a long-held connection, not a normal request/response.

location ^~ /vote/api/v1/events/ {
    access_log off;  # Disable access logging for this location
    proxy_pass http://127.0.0.1:3349/v1/events/;  # Include the backend path

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;       # stream events immediately; the backend also sends X-Accel-Buffering: no
    proxy_read_timeout 3600s;  # SSE stays open; the backend pings every 25s so this is just a safety margin
    proxy_send_timeout 3600s;
}


location = /vote {
    access_log off;  # Disable access logging for this location
    proxy_pass http://127.0.0.1:3049;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /vote/ {
    access_log off;  # Disable access logging for this location
    proxy_pass http://127.0.0.1:3049;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# New rewrite for _next/data path
location /_next/data {
    rewrite ^/_next/data/(.*)$ /subscriptions/_next/data/$1 last;
}
